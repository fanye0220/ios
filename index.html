<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MIU</title>
    <meta name="description" content="MIU - 角色卡与酒馆资源管理工具" />
    <meta property="og:title" content="MIU" />
    <meta property="og:description" content="MIU - 角色卡与酒馆资源管理工具" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MIU" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // MIU 早期错误兜底（必须先于模块脚本执行）
      // 1) 资源加载失败：捕获阶段能拿到具体失败的地址，把「被浏览器屏蔽的报错」变成可用线索
      // 2) 模块脚本加载失败：自动重载一次（自愈），解决 iOS 主屏幕缓存到旧版本、引用已删除文件的问题
      // 3) 来源不明的 "Script error."（代理/注入脚本等）：只弹不挡路的小横幅，不黑屏，应用照常能用
      (function () {
        var RELOAD_KEY = 'miu_asset_reload_at';

        function host() {
          return document.body || document.documentElement;
        }

        function ensureBox() {
          var b = document.getElementById('miu-crash-info');
          if (!b) {
            b = document.createElement('div');
            b.id = 'miu-crash-info';
            b.style.cssText = 'position:fixed;left:0;right:0;top:0;bottom:0;z-index:2147483647;background:#0b0b0d;color:#ff9b9b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text';
            host().appendChild(b);
          }
          return b;
        }

        function show(title, detail, canReload) {
          try {
            var box = ensureBox();
            box.textContent = '';
            var text = document.createElement('div');
            text.textContent = '[MIU 出错信息 · 请把这一段截图发给开发者]\n' + title + '\n\n' + detail;
            box.appendChild(text);
            if (canReload) {
              var btn = document.createElement('button');
              btn.textContent = '点这里重新加载';
              btn.style.cssText = 'margin-top:16px;padding:10px 18px;border-radius:12px;border:0;background:#2563eb;color:#fff;font-size:14px;font-weight:700';
              btn.onclick = function () { location.reload(); };
              box.appendChild(btn);
            }
          } catch (e) {}
        }

        function appMounted() {
          var r = document.getElementById('root');
          return !!(r && r.childElementCount > 0);
        }

        // 来源不明的错误：小横幅提示，不遮挡界面，应用能继续用
        function banner(title, detail) {
          try {
            var b = document.getElementById('miu-crash-banner');
            if (!b) {
              b = document.createElement('div');
              b.id = 'miu-crash-banner';
              b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483000;background:#1b1b1f;color:#ffb4b4;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;padding:20px 34px 10px 12px;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.45);white-space:pre-wrap;word-break:break-word;max-height:40vh;overflow:auto';
              var close = document.createElement('button');
              close.textContent = '×';
              close.setAttribute('aria-label', '关闭');
              close.style.cssText = 'position:absolute;top:2px;right:6px;border:0;background:transparent;color:#ffb4b4;font-size:18px;line-height:1.2;padding:4px';
              close.onclick = function () { if (b.parentNode) b.parentNode.removeChild(b); };
              b.appendChild(close);
              var txt = document.createElement('div');
              txt.id = 'miu-crash-banner-text';
              b.appendChild(txt);
              host().appendChild(b);
            }
            var t = document.getElementById('miu-crash-banner-text');
            if (t) {
              var line = '[MIU 提示 · 后台脚本出错，不影响使用] ' + title + ' ' + detail;
              if (t.textContent.indexOf(line) === -1) {
                t.textContent = t.textContent ? t.textContent + '\n' + line : line;
              }
            }
          } catch (e) {}
        }

        function isAnonymousScriptError(msg, file, err) {
          if (err) return false;
          if (file) return false;
          return !msg || msg === 'Script error.' || msg === 'Script error';
        }

        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t !== window && t.tagName) {
            var tag = String(t.tagName).toLowerCase();
            if (tag !== 'script' && tag !== 'link') return;
            var url = t.src || t.href || '(未知地址)';
            show('资源加载失败: ' + tag, url + (tag === 'script' ? '\n\n这通常是「首页被缓存成旧版本，引用了已经不存在的文件」。' : ''), true);
            if (tag === 'script') {
              try {
                var last = Number(sessionStorage.getItem(RELOAD_KEY) || 0);
                if (Date.now() - last > 20000) {
                  sessionStorage.setItem(RELOAD_KEY, String(Date.now()));
                  setTimeout(function () { location.reload(); }, 800);
                }
              } catch (e2) {}
            }
            return;
          }
          var msg = (e && e.message) || '';
          var file = (e && e.filename) || '';
          var err = e && e.error;
          if (isAnonymousScriptError(msg, file, err)) {
            banner('Script error.', '来源不明（常见于代理/注入脚本，或首页缓存过旧），已跳过，应用可继续使用');
            setTimeout(function () {
              if (!document.getElementById('miu-crash-info') && !appMounted()) {
                show('Error: Script error.', '来源不明，且应用没有起来。多为「首页缓存成旧版本」，点下面按钮重新加载即可。', true);
              }
            }, 6000);
            return;
          }
          show('Error: ' + msg, file + ':' + ((e && e.lineno) || 0) + ':' + ((e && e.colno) || 0) + '\n' + ((err && (err.stack || err.message)) || ''), false);
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var msg = (r && r.message) || (typeof r === 'string' ? r : '');
          var stack = (r && r.stack) || '';
          if (!msg && !stack) {
            banner('UnhandledRejection', '来源不明，已跳过');
            return;
          }
          show('UnhandledRejection: ' + msg, stack, false);
        });

        window.__miuCrash = { show: show, banner: banner };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
